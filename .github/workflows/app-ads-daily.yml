name: Update app-ads.txt daily

# Required repository secrets (Settings → Secrets and variables → Actions):
#   GIT_STATUS_URL   — endpoint the workflow POSTs its outcome to, so the daily status
#                      report can show when app-ads.txt last ran and whether it changed.
#   GIT_STATUS_TOKEN — shared token sent with the request to authenticate it.
# Without these secrets the workflow still updates app-ads.txt; only the status report is skipped.

on:
  # Runs daily at 03:00 UTC — ~2h before the DailyDigest Lambda (05:00 UTC), so its
  # status is fresh when the digest reads it. GitHub may delay scheduled runs under
  # load; the digest tolerates this by showing the last recorded run + a staleness flag.
  schedule:
    - cron: "0 3 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Needed to push the app-ads.txt commit to master and to the gh-pages branch
permissions:
  contents: write

# Don't overlap with another run of this workflow
concurrency:
  group: app-ads-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update app-ads.txt from CAS.ai reference
        # Self-contained script (only Node built-ins), no npm install needed here
        run: node scripts/update-app-ads.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- public/app-ads.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "app-ads.txt is up to date. Skipping commit/build/deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Cache node_modules keyed on package.json. No committed lockfile (see
      # .npmrc), so we key on package.json instead of package-lock.json. CI is
      # always ubuntu-latest, so caching platform-specific binaries is safe here.
      - name: Cache node_modules
        id: npm-cache
        if: steps.diff.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package.json') }}

      - name: Install dependencies
        # Only needed for build/deploy, which run only when there are changes.
        # Skipped entirely on a cache hit (package.json unchanged).
        if: steps.diff.outputs.changed == 'true' && steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Commit and push app-ads.txt
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-ads.txt
          git commit -m "Update app-ads.txt from CAS.ai reference"
          git push

      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Deploy to gh-pages
        if: steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh-pages clones origin into its own cache dir, which has none of the
          # credentials actions/checkout stored, and it doesn't read GITHUB_TOKEN
          # itself — hence "could not read Username". Rewrite github.com HTTPS URLs
          # to embed the token (applies to gh-pages' child clone too) and set a
          # global committer identity, since that fresh clone has none.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          npm run deploy

      # Report the outcome to the GitStatus Lambda, which records it in DynamoDB for
      # the DailyDigest to surface. Runs on EVERY successful run: "updated" when the
      # file changed, "up_to_date" otherwise. This heartbeat lets the digest detect a
      # stalled workflow. The token gates the public Function URL (see GitStatus.mjs).
      - name: Report status to Lambda
        if: success()
        env:
          GIT_STATUS_URL: ${{ secrets.GIT_STATUS_URL }}
          GIT_STATUS_TOKEN: ${{ secrets.GIT_STATUS_TOKEN }}
          CHANGED: ${{ steps.diff.outputs.changed }}
        run: |
          if [ "$CHANGED" = "true" ]; then STATUS="updated"; else STATUS="up_to_date"; fi
          curl -sS -X POST "$GIT_STATUS_URL" \
            -H "Content-Type: application/json" \
            -H "X-Auth-Token: $GIT_STATUS_TOKEN" \
            -d "{\"status\":\"$STATUS\",\"datetime\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"runUrl\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"

      # Runs only if an earlier step failed, so the digest can show "last run failed".
      - name: Report failure to Lambda
        if: failure()
        env:
          GIT_STATUS_URL: ${{ secrets.GIT_STATUS_URL }}
          GIT_STATUS_TOKEN: ${{ secrets.GIT_STATUS_TOKEN }}
        run: |
          curl -sS -X POST "$GIT_STATUS_URL" \
            -H "Content-Type: application/json" \
            -H "X-Auth-Token: $GIT_STATUS_TOKEN" \
            -d "{\"status\":\"failed\",\"datetime\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"runUrl\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
